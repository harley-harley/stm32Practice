[package]
name = "rustRewrite"
version = "0.1.0"
edition = "2024"

[package.metadata.embassy]
build = [
  { target = "thumbv7em-none-eabi", features = ["skip-include"], artifact-dir = "out/examples/boot/stm32h7" }
]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]

embassy-sync = { version = "0.8.0"}
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.1", features = [ "defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-stm32 = {version = "0.6.0",  features = ["defmt", "stm32h753zi", "time-driver-tim2", "exti", "memory-x", "unstable-pac", "chrono"]}
# embassy-boot-stm32 = { version = "0.8.0"}
embassy-embedded-hal = { version = "0.6.0" }

cortex-m = { version = "0.7.8", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.6"

defmt = "1.1.1"
defmt-rtt = "1.3.0"

panic-probe = { version = "1.0.0", features = ["print-defmt"] }
embedded-test = { version = "0.7.0" }
